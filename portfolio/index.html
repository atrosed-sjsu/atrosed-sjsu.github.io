<!DOCTYPE html>
<html lang="en-US">

<head>
<title>Portfolio Homepage</title>
<style>

header {
  background-color: #666;
  padding: 30px;
  text-align: center;
  font-size: 35px;
  color: white;
}
nav {
  float: left;
  width: 100%;
  height: 140px; /* only for demonstration, should be removed */
  background: #ccc;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

li {
  float: left;
}

li a {
  display: block;
  color: white;
  text-align: center;
  padding: 16px;
  text-decoration: none;
}

li a:hover {
  background-color: #111111;
}
li a:visited {
  background-color: #111111;
}

article {
  float: left;
  padding: 20px;
  width: 70%;
  background-color: #f1f1f1;
  height: 300px; 
}

/* Style the footer */
footer {
  background-color: #777;
  padding: 10px;
  text-align: center;
  color: white;
}
</style>
</head>

<body>
    <section>
    
    <nav>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Core Collections</li>
        <li>Rose's Reverie</li>
    </ul>
    </nav>

    <article>
        <p>portfolio in progress</p>
    </article>
    </section>

    <footer>
        <p>footer</p>
    </footer>

</body>

</html lang="en-US">
